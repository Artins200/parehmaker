# Публикует папку barber-app на GitHub Pages: постоянный HTTPS-адрес
#   https://<логин>.github.io/<репозиторий>/
# и автоматическое обновление сайта после каждого слияния в main.
#
# Один раз включите Pages: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Если публикация не запускалась (Pages включили позже слияния): Actions → «Публикация на
# GitHub Pages» → Run workflow.
name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно выкладывается только одна версия; уже идущую публикацию не прерываем.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: barber-app
      - id: deployment
        uses: actions/deploy-pages@v5
