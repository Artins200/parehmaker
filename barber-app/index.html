<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<title>Джентльмен — онлайн-запись в барбершоп</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="Онлайн-запись в мужскую парикмахерскую: выбор барбера, услуги, времени и оценка мастера.">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta id="theme-color-light" name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta id="theme-color-dark" name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Джентльмен">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">
  <header class="appbar">
    <div class="appbar__logo" aria-hidden="true"><i class="ic ic-22" data-ic="scissors"></i></div>
    <h1 class="appbar__title" id="appbar-title">Джентльмен<small>Барбершоп, ул. Ленина, 15</small></h1>
    <button class="btn btn-icon" id="theme-btn" data-act="theme" aria-label="Переключить тему">
      <i class="ic ic-22" data-ic="moon"></i>
    </button>
  </header>

  <main class="view" id="view" role="main"></main>

  <nav class="tabbar" id="tabbar" aria-label="Основная навигация"></nav>
</div>

<div id="modal-root"></div>
<div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="false"></div>

<noscript>
  <p style="padding:24px;text-align:center">Для работы приложения включите JavaScript.</p>
</noscript>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/booking.js"></script>
<script src="js/app.js"></script>
</body>
</html>
